name: Templates
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pipx install copier
      - run: |
          copier copy --defaults --data package_name=demolib --data description="demo"             --data keywords='["demo"]' copier-templates/npm /tmp/fgen-npm
          cd /tmp/fgen-npm && npm install && npm test

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pipx install copier
      - run: |
          copier copy --defaults --data package_name=demolib --data description="demo"             copier-templates/pypi /tmp/fgen-py
          cd /tmp/fgen-py && python -m unittest discover -s tests -v

  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: dtolnay/rust-toolchain@stable
      - run: pipx install copier
      - run: |
          copier copy --defaults --data package_name=demolib --data description="demo"             copier-templates/crates /tmp/fgen-cr
          cd /tmp/fgen-cr && cargo test
