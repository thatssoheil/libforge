name: Publish
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    env:
      # The publish credential itself is injected on the publish step ONLY.
      # Hoisting the token to job level would hand it to every other step
      # (install, tests, third-party actions); this boolean carries the same
      # information without the secret.
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install
      - run: npm test
      # One trigger only (release: published, plus manual dispatch). Pairing a
      # release event with a tag-push event made every release open TWO runs
      # that raced to publish the same version, and the loser failed noisily.
      # Manual dispatch publishes whatever ref it is started from, so start it
      # from the release tag when publishing a specific release.
      - name: Check whether this version is already on the registry
        id: check
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          set +e
          out=$(npm view "$name@$version" version 2>&1)
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif printf '%s' "$out" | grep -q 'E404'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            # Fail CLOSED. An unreachable or erroring registry must never be
            # read as "not published yet": that is how a run ends up trying to
            # publish over a version that already exists.
            echo "::error::cannot tell whether $name@$version is published - registry lookup failed: $out"
            exit 1
          fi
      # A package that does not exist on the registry yet CANNOT be
      # first-published through OIDC trusted publishing: trusted publishers are
      # registered per package on npmjs.com, and registering one requires the
      # package to already exist. So the first release authenticates with a
      # granular NPM_TOKEN secret. Deleting that secret later is the whole
      # switch to OIDC - the second publish step takes over, no other change.
      #
      # With NEITHER a token NOR a registered trusted publisher this job cannot
      # publish, and the OIDC step below fails with npm's not-logged-in error.
      # That failure is the signal to add one of the two - it is not a bug in
      # the workflow.
      - name: Publish with NPM_TOKEN (first release)
        if: ${{ steps.check.outputs.exists == 'false' && env.HAS_NPM_TOKEN == 'true' }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish via OIDC trusted publishing
        if: ${{ steps.check.outputs.exists == 'false' && env.HAS_NPM_TOKEN != 'true' }}
        run: npm publish --provenance --access public
