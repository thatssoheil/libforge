package_name:
  type: str
  default: mylib
  help: Package name (PyPI + repo name)
python_name:
  type: str
  default: "{{ package_name | replace('-', '_') }}"
  help: Python import name (package_name with hyphens as underscores)
description:
  type: str
  default: A tiny zero-dependency utility.
  help: One-line description
_subdirectory: project
